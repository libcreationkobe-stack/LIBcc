<title>ATTRIA</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=M+PLUS+1p:wght@400;500;700&display=swap">
<style>
/* Layout: dark fixed sidebar + light working canvas; condensed display type for slogans, orange as the single accent. */
:root {
  --bg: #F5F4F1;
  --surface: #FFFFFF;
  --field: #F1EFEB;
  --ink: #1C1B1A;
  --muted: #7A7570;
  --line: #E4E0DA;
  --accent: #FF6600;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFF0E6;
  --side: #1E1D1C;
  --side-ink: #EDEBE7;
  --side-muted: #8E8984;
  --side-line: #343230;
  --good: #1F8A5B;
  --good-soft: #E5F4EC;
  --bad: #C8402F;
  --bad-soft: #FBEAE7;
  --s0: #FF6600; --s1: #1C1B1A; --s2: #A29C95; --s3: #2F6FDE; --s4: #1F9D6B;
  --radius: 6px;
  --pad: 24px;
  --display: 'Anton', 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --body: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  --num: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 16px; padding: 20px 14px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-logo { display: block; padding: 2px 6px 0; }
.brand-logo img { width: 100%; max-width: 176px; height: auto; display: block; }
.brand-name { font-family: var(--display); font-size: 19px; line-height: .95; letter-spacing: .02em; text-transform: uppercase; }
.brand-sub { font-size: 9.5px; letter-spacing: .14em; color: var(--side-muted); margin-top: 4px; text-transform: uppercase; }
.side label.cs { display: grid; gap: 4px; font-size: 10px; letter-spacing: .12em; color: var(--side-muted); padding: 0 6px; }
.side select { background: transparent; border: 1px solid var(--side-line); color: var(--side-ink); border-radius: var(--radius); padding: 7px 8px; font-size: 12px; width: 100%; }
.side select option { color: #1C1B1A; }
.nav-group { display: grid; gap: 1px; }
.nav-title { font-size: 9.5px; letter-spacing: .16em; color: var(--side-muted); padding: 6px 8px; text-transform: uppercase; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius); text-decoration: none; font-size: 12.5px; color: var(--side-ink); opacity: .82; }
.nav a:hover { background: var(--side-line); opacity: 1; }
.nav a.on { background: var(--accent); color: var(--accent-ink); opacity: 1; font-weight: 700; }
.nav a svg { width: 15px; height: 15px; flex: none; }
.side-foot { margin-top: auto; padding: 8px 6px 0; }
.side-foot img { width: 104px; height: auto; display: block; opacity: .92; }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.crumb { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.crumb b { color: var(--ink); font-weight: 500; }
.ver { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; gap: 3px; background: var(--surface); flex: none; }
.ver button { border: 0; background: transparent; padding: 5px 12px; border-radius: calc(var(--radius) - 2px); font-size: 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.ver button.on { background: var(--side); color: var(--side-ink); font-weight: 700; }
.ver button.on::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.ver small { font-size: 9px; letter-spacing: .1em; opacity: .7; font-weight: 400; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 9px; cursor: pointer; }
main { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

/* ---------- page head ---------- */
.ph { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.ph-text { flex: 1 1 360px; min-width: 0; }
.eyebrow { font-size: 10.5px; letter-spacing: .2em; color: var(--muted); font-weight: 700; text-transform: uppercase; font-family: var(--num); }
.ph h1 { margin: 6px 0 4px; font-size: clamp(26px, 4vw, 34px); font-weight: 900; letter-spacing: .02em; line-height: 1.25; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; font-size: 13px; }
.ph-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 8px 14px; font-size: 12.5px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.dark { background: var(--side); color: var(--side-ink); border-color: var(--side); }
.btn.acc { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.sm { padding: 5px 10px; font-size: 11.5px; }
.btn.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn svg { width: 14px; height: 14px; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.input, .field input:not([type=checkbox]):not([type=range]), .field select, .field textarea, select.input { width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px; font-size: 13px; min-width: 0; }
.field textarea { resize: vertical; min-height: 96px; }
textarea.mono { font-family: var(--num); font-size: 12px; }
.suffix { position: relative; }
.suffix input { padding-right: 34px !important; }
.suffix em { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 16px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; }
.check { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; background: var(--surface); }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.check input { accent-color: var(--accent); margin: 0; }
hr.div { border: 0; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
details.more > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); padding: 4px 0; }
details.more[open] > summary { margin-bottom: 10px; }

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--pad); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-h h2, .panel-h h3 { margin: 0; font-size: 15px; font-weight: 700; }
.panel-h .eyebrow { width: 100%; font-size: 9.5px; }
.panel-h .right { margin-left: auto; }
.bar-title { border-left: 3px solid var(--accent); padding-left: 9px; }
.sec-head { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.sec-head > div { flex: 1 1 300px; display: grid; gap: 4px; }
.sec-head h2 { margin: 0; font-size: 20px; font-weight: 900; }
.sec-head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--field); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; font-weight: 500; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.dark { background: var(--side); color: var(--side-ink); border-color: transparent; }
.note { display: flex; gap: 12px; align-items: flex-start; background: var(--field); border-radius: var(--radius); padding: 14px 16px; font-size: 12px; color: var(--muted); }
.note b { color: var(--ink); display: block; font-size: 12.5px; margin-bottom: 2px; }
.note .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); opacity: .85; flex: none; margin-top: 1px; }
.note.warm { background: var(--accent-soft); border: 1px solid var(--accent); }
.banner { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 14px 18px; }
.banner div { flex: 1 1 260px; font-size: 12px; }
.banner b { display: block; font-size: 13.5px; }
.sample-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; font-size: 12.5px; }
.sample-bar .btn { margin-left: auto; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tiles.t3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 4px; min-width: 0; align-content: start; }
.tile .lbl { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.tile .lbl svg { width: 14px; height: 14px; color: var(--accent); flex: none; }
.tile .val { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; overflow-wrap: anywhere; }
.tile .val small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.tile .val.empty { font-family: var(--body); font-size: 20px; color: var(--muted); }
.tile .sub { font-size: 11px; color: var(--muted); }
.tile.hero { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tile.ink { background: var(--side); color: var(--side-ink); border-color: var(--side); }
.tile.hero .lbl, .tile.hero .sub, .tile.hero .val small, .tile.hero .lbl svg, .tile.ink .lbl, .tile.ink .sub, .tile.ink .val small, .tile.ink .lbl svg { color: inherit; opacity: .88; }
.tile.hero .delta, .tile.ink .delta { color: inherit; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }

/* funnel list */
.flist { display: grid; }
.flist div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); align-items: center; }
.flist div:last-child { border-bottom: 0; }
.flist span { font-size: 12.5px; } .flist small { grid-column: 1; font-size: 10.5px; color: var(--muted); }
.flist b { grid-row: 1 / 3; grid-column: 2; font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 17px; }
.flist .goal { background: var(--accent-soft); border-radius: var(--radius); border-bottom: 0; padding-inline: 10px; }
.flist .goal b { color: var(--accent); }
.meter { height: 6px; background: var(--field); border-radius: 3px; overflow: hidden; min-width: 80px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.lg { height: 8px; border-radius: 4px; }
.meter i.ok { background: var(--good); }
.ctile .pct { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700; line-height: 1.1; }
.ctile .pct.ok { color: var(--good); }
.ctile .av { font-size: 12px; color: var(--muted); }
.ctile .av b { color: var(--ink); font-family: var(--num); font-size: 14px; }
.ctile .row { justify-content: space-between; }
.commit-sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; background: var(--side); color: var(--side-ink); border-radius: var(--radius); padding: 20px 24px; }
.commit-sum .big { font-family: var(--num); font-size: clamp(40px, 6vw, 56px); font-weight: 700; line-height: 1; color: var(--accent); }
.commit-sum p { margin: 4px 0 0; font-size: 12px; color: var(--side-muted); }
.commit-sum .eyebrow { color: var(--side-muted); }
td input.cell { width: 92px; text-align: right; background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 12.5px; }
td input.cell::placeholder { color: var(--muted); opacity: .7; }
tr.now td { background: var(--accent-soft); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
th { font-size: 11px; color: var(--muted); font-weight: 500; background: var(--field); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
td .sub, th .sub { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
tr.total td { background: var(--field); font-weight: 700; }
td.dim { color: var(--muted); font-size: 11px; }
td select { background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font-size: 12px; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-txt { fill: var(--muted); font: 10.5px var(--num); }
.b.s0 { fill: var(--s0); } .b.s1 { fill: var(--s1); } .b.s2 { fill: var(--s2); } .b.s3 { fill: var(--s3); } .b.s4 { fill: var(--s4); }
.l { fill: none; stroke-width: 2; }
.l.s0 { stroke: var(--s0); } .l.s1 { stroke: var(--s1); } .l.s2 { stroke: var(--s2); } .l.s3 { stroke: var(--s3); } .l.s4 { stroke: var(--s4); }
.l.dash { stroke-dasharray: 4 3; }
.d { fill: var(--surface); stroke-width: 2; }
.d.s0 { stroke: var(--s0); } .d.s1 { stroke: var(--s1); } .d.s2 { stroke: var(--s2); } .d.s3 { stroke: var(--s3); } .d.s4 { stroke: var(--s4); }
.a.s0 { fill: var(--s0); opacity: .1; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.ln { height: 2px; width: 14px; vertical-align: 3px; border-radius: 0; }
.k0 { background: var(--s0); } .k1 { background: var(--s1); } .k2 { background: var(--s2); } .k3 { background: var(--s3); } .k4 { background: var(--s4); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12px; }
.hbar .tr { height: 8px; background: var(--field); border-radius: 4px; overflow: hidden; }
.hbar .tr.tall { height: 18px; }
.hbar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.hbar .p { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; color: var(--muted); }
.empty { display: grid; place-items: center; text-align: center; gap: 6px; padding: 26px 10px; color: var(--muted); font-size: 12px; }
.empty svg { width: 26px; height: 26px; color: var(--muted); }
.empty b { color: var(--ink); font-size: 13px; }

/* cards list */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.card.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card-top { display: flex; gap: 12px; align-items: center; }
.card-top .chip { margin-left: auto; }
.avatar { width: 34px; height: 34px; border-radius: var(--radius); background: var(--side); color: var(--side-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.avatar.round { border-radius: 50%; }
.card h3 { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.card .meta { font-size: 11.5px; color: var(--muted); }
.card .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 11.5px; }
.card .kv span:nth-child(odd) { color: var(--muted); }
.card .kv span:nth-child(even) { text-align: right; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.card .acts .btn { flex: 1; justify-content: center; }
.card .link { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; text-decoration: none; border-top: 1px solid var(--line); padding-top: 10px; }
.idx { font-family: var(--num); font-size: 10px; color: var(--muted); letter-spacing: .1em; }

/* tabs */
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; gap: 4px; }
.tabs button { flex: 0 0 auto; border: 0; background: transparent; padding: 10px 14px; font-size: 12.5px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.tabs.fill button { flex: 1 0 auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--side); color: var(--side-ink); }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.steps div { padding: 12px 16px; font-size: 12.5px; border-right: 1px solid var(--line); display: flex; gap: 10px; align-items: center; color: var(--muted); }
.steps div:last-child { border-right: 0; }
.steps b { font-family: var(--display); font-size: 20px; color: var(--accent); font-weight: 400; }
.steps .on { background: var(--accent-soft); color: var(--ink); font-weight: 700; }

/* dashboard hero */
.dhero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.dhero .big { font-family: var(--display); font-size: clamp(54px, 9vw, 104px); line-height: .9; text-transform: uppercase; }
.dhero .big span { color: var(--accent); display: block; }
.dhero .catch { margin-top: 12px; font-size: 13px; font-weight: 700; }
.hero-card { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 22px; display: grid; gap: 8px; align-content: space-between; min-width: 0; }
.hero-card .chip { background: transparent; color: inherit; border-color: currentColor; }
.hero-card h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
.hero-card p { margin: 0; font-size: 12px; opacity: .9; }
.hero-card .foot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid currentColor; padding-top: 10px; font-size: 11px; gap: 10px; }
.hero-card .mo { font-family: var(--display); font-size: 30px; line-height: 1; }

/* design page */
.themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.theme { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 12px; cursor: pointer; display: grid; gap: 8px; }
.theme.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
.theme .sw { display: grid; grid-template-columns: 2fr 2fr 2fr 1.2fr; height: 14px; border-radius: 2px; overflow: hidden; }
.theme b { font-size: 12.5px; } .theme span { font-size: 11px; color: var(--muted); }
.design-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.design-form { padding: 0; }
.design-form .body { padding: var(--pad); display: grid; gap: 16px; }
.design-form h3 { margin: 0; font-size: 14px; }
.drop { border: 1px dashed var(--muted); border-radius: var(--radius); padding: 24px; display: grid; place-items: center; gap: 8px; background-image: linear-gradient(45deg, var(--field) 25%, transparent 25%, transparent 75%, var(--field) 75%), linear-gradient(45deg, var(--field) 25%, transparent 25%, transparent 75%, var(--field) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; cursor: pointer; text-align: center; font-size: 12px; color: var(--muted); }
.drop .inner { background: var(--surface); padding: 12px 18px; border-radius: var(--radius); display: grid; gap: 6px; place-items: center; }
.drop .inner svg { width: 20px; height: 20px; color: var(--accent); }
.drop img { max-height: 54px; max-width: 160px; }
.drop.over { border-color: var(--accent); }
.hint { font-size: 11px; color: var(--muted); margin: 0; }
.color-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: end; }
.color-row input[type=color] { width: 36px; height: 38px; border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; background: var(--surface); cursor: pointer; }
.preview-h { display: flex; gap: 8px; align-items: center; font-size: 10.5px; letter-spacing: .14em; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
.preview-h .live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.mini { display: grid; grid-template-columns: 30% 70%; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-height: 300px; background: var(--bg); }
.mini .ms { background: var(--side); color: var(--side-ink); padding: 12px 10px; display: grid; gap: 6px; align-content: start; font-size: 9px; }
.mini .ms .bn { font-family: var(--display); font-size: 13px; line-height: .95; text-transform: uppercase; margin-bottom: 8px; }
.mini .ms .it { padding: 4px 6px; border-radius: 3px; opacity: .7; }
.mini .ms .it.on { background: var(--accent); color: var(--accent-ink); opacity: 1; }
.mini .mm { padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.mini .hd { font-family: var(--display); font-size: 28px; line-height: .95; text-transform: uppercase; }
.mini .hd span { color: var(--accent); display: block; }
.mini .tl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini .tl > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; font-size: 9px; color: var(--muted); }
.mini .tl > div:first-child { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mini .tl b { display: block; font-family: var(--num); font-size: 16px; color: inherit; }
.mini .tl > div:not(:first-child) b { color: var(--ink); }
.mini .ch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 12px; margin-top: 12px; font-size: 10.5px; color: var(--muted); }
.swatches span { display: flex; align-items: center; gap: 6px; }
.swatches i { width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--line); }

/* csv templates */
.tpl { background: var(--side); color: var(--side-ink); border-radius: var(--radius); padding: var(--pad); display: grid; gap: 12px; align-content: start; }
.tpl .eyebrow { color: var(--side-muted); }
.tpl h3 { margin: 0; font-size: 20px; font-weight: 900; }
.tpl p { margin: 0; font-size: 12px; color: var(--side-muted); }
.tpl button.t { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; background: transparent; color: var(--side-ink); border: 1px solid var(--side-line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
.tpl button.t:hover { border-color: var(--accent); }
.tpl button.t b { font-size: 12.5px; } .tpl button.t span { font-size: 10.5px; color: var(--side-muted); grid-column: 1; }
.tpl button.t svg { grid-row: 1 / 3; grid-column: 2; align-self: center; width: 16px; height: 16px; color: var(--accent); }
.tpl textarea { background: transparent; color: var(--side-ink); border: 1px solid var(--side-line); border-radius: var(--radius); padding: 10px; width: 100%; min-height: 110px; font: 11.5px var(--num); }

/* gantt */
.gantt { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.g-row { display: grid; grid-template-columns: 180px minmax(0, 1fr); border-bottom: 1px solid var(--line); min-width: 640px; }
.g-row:last-child { border-bottom: 0; }
.g-row > div:first-child { padding: 8px 12px; font-size: 12px; border-right: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-track { position: relative; height: 36px; }
.g-bar { position: absolute; top: 9px; height: 18px; border-radius: 4px; background: var(--accent); }
.g-bar.done { background: var(--s2); }
.g-bar.todo { background: var(--accent); opacity: .45; }
.g-head .g-track { height: 28px; }
.g-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 10px; color: var(--muted); padding: 6px 4px; font-family: var(--num); white-space: nowrap; }
.g-today { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--bad); }

/* report */
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 40px); display: grid; gap: 24px; }
.doc-head { display: flex; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; align-items: flex-end; }
.doc-head h2 { margin: 4px 0 0; font-size: 26px; font-weight: 900; }
.doc-head img { max-height: 48px; max-width: 160px; }
.doc .hero-num { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 26px 28px; display: grid; gap: 4px; }
.doc .hero-num .v { font-family: var(--num); font-size: clamp(44px, 8vw, 72px); font-weight: 700; line-height: 1; }
.doc .hero-num .eyebrow { color: inherit; opacity: .85; }
.comment { border-left: 3px solid var(--accent); padding-left: 12px; display: grid; gap: 4px; }
.comment b { font-size: 13.5px; }
.comment p { margin: 0; font-size: 12.5px; white-space: pre-wrap; color: var(--muted); }
.next { background: var(--side); color: var(--side-ink); border-radius: var(--radius); padding: 28px; display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 24px; }
.next .big { font-family: var(--display); font-size: clamp(40px, 6vw, 60px); line-height: .92; text-transform: uppercase; }
.next .big span { color: var(--accent); }
.next ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; border-left: 1px solid var(--side-line); padding-left: 22px; }
.next li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 12.5px; }
.next li b { display: block; font-size: 13px; }
.next li span { color: var(--side-muted); }
.next li svg { color: var(--accent); width: 16px; height: 16px; margin-top: 2px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--side); color: var(--side-ink); padding: 10px 18px; border-radius: var(--radius); font-size: 12.5px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }

/* ================= charts ================= */
// series: [{name, values, kind:'bar'|'line', axis:'L'|'R', c:0-4, dash, area}]
function chart({ labels, series, h = 240, fmtL = compact, fmtR = v => Math.round(v * 10) / 10 + '%', minL = null }) {
  const W = 700, hasR = series.some(s => s.axis === 'R'), L = 54, Rm = hasR ? 48 : 16, T = 14, B = 30, iw = W - L - Rm, ih = h - T - B;
  const vals = ax => series.filter(s => (s.axis || 'L') === ax).flatMap(s => s.values.filter(isNum).map(Number));
  const lv = vals('L'), rv = vals('R');
  if (!lv.length && !rv.length) return '';
  let lo = 0;
  if (minL === 'auto' && lv.length) { const mn = Math.min(...lv), mx = Math.max(...lv); if (mn > 0 && (mx - mn) / mx < .5) lo = niceMax(mn) / 2 > mn ? 0 : Math.floor(mn / niceMax((mx - mn) || 1)) * niceMax((mx - mn) || 1); }
  const lmax = lo + niceMax(Math.max(1, ...lv) - lo), rmax = niceMax(Math.max(1, ...rv));
  const yL = v => T + ih - ih * (v - lo) / (lmax - lo), yR = v => T + ih - ih * v / rmax;
  let s = '<svg viewBox="0 0 ' + W + ' ' + h + '" role="img">';
  for (let i = 0; i <= 4; i++) {
    const y = T + ih - ih * i / 4;
    s += '<line class="c-grid" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + y + '" y2="' + y + '"/>';
    if (lv.length) s += '<text class="c-txt" x="' + (L - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmtL(lo + (lmax - lo) * i / 4) + '</text>';
    if (hasR) s += '<text class="c-txt" x="' + (W - Rm + 8) + '" y="' + (y + 3.5) + '">' + fmtR(rmax * i / 4) + '</text>';
  }
  const n = labels.length, slot = iw / Math.max(n, 1);
  const bars = series.filter(x => x.kind === 'bar');
  const gw = Math.min(slot * .72, bars.length * 22), bw = bars.length ? gw / bars.length : 0;
  bars.forEach((se, si) => se.values.forEach((v, i) => {
    if (!isNum(v)) return; const y = (se.axis === 'R' ? yR : yL)(Number(v)), base = T + ih;
    s += '<rect class="b s' + se.c + '" x="' + (L + slot * i + slot / 2 - gw / 2 + bw * si + 1).toFixed(1) + '" y="' + Math.min(y, base).toFixed(1) + '" width="' + Math.max(bw - 2, 2).toFixed(1) + '" height="' + Math.abs(base - y).toFixed(1) + '" rx="1.5"/>';
  }));
  series.filter(x => x.kind !== 'bar').forEach(se => {
    const f = se.axis === 'R' ? yR : yL;
    const pts = se.values.map((v, i) => isNum(v) ? [L + slot * i + slot / 2, f(Number(v))] : null).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    if (se.area && pts.length > 1) s += '<path class="a s' + se.c + '" d="' + d + 'L' + pts[pts.length - 1][0] + ' ' + (T + ih) + 'L' + pts[0][0] + ' ' + (T + ih) + 'Z"/>';
    s += '<path class="l s' + se.c + (se.dash ? ' dash' : '') + '" d="' + d + '"/>';
    pts.forEach((p, i) => s += '<circle class="d s' + se.c + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (i === pts.length - 1 ? 4 : 3) + '"/>');
  });
  labels.forEach((lb, i) => s += '<text class="c-txt" x="' + (L + slot * i + slot / 2) + '" y="' + (h - 10) + '" text-anchor="middle">' + esc(lb) + '</text>');
  return s + '</svg>';
}

  };

R.compare = () => {
  const c = client(); if (!c) return noClient('期間で、成果を見比べる。');
  const all = monthsOf();
  if (!ui.cmp) ui.cmp = { from: all.length ? all[Math.max(0, all.length - 6)] : thisMonth(), to: all.length ? all[all.length - 1] : thisMonth(), metric: 'reach', chs: ['instagram', 'meta'], clients: S.clients.slice(0, 3).map(x => x.id), view: 'line' };
  const q = ui.cmp;

  h += '<form class="panel" id="taskForm" ' + (ui.newTask ? '' : 'hidden') + '><div class="panel-h"><h3 class="bar-title">タスクを追加</h3></div><div class="grid3">' +
    '<label class="field"><span>タスク名</span><input id="tTitle" required placeholder="例：12月 リール撮影"></label>' +
    '<label class="field"><span>担当</span><select id="tAsg">' + S.editors.map(e => '<option>' + esc(e.name) + '</option>').join('') + '</select></label>' +
    '<label class="field"><span>媒体</span><select id="tCh">' + CH.map(x => '<option value="' + x.k + '">' + x.l + '</option>').join('') + '</select></label>' +
    '<label class="field"><span>開始日</span><input type="date" id="tStart" value="' + today + '" required></label><label class="field"><span>期限</span><input type="date" id="tEnd" value="' + today + '" required></label>' +
    '<label class="field"><span>状態</span><select id="tSt"><option value="todo">未着手</option><option value="doing">進行中</option><option value="done">完了</option></select></label></div><div class="row" style="margin-top:14px"><button class="btn dark" type="submit">' + I.plus + '追加する</button><button class="btn ghost" type="button" data-act="toggleNewTask">閉じる</button></div></form>';
  h += '<div class="row"><div class="tabs" style="flex:1">' + [['list', 'タスク一覧'], ['gantt', 'ガントチャート']].map(([k, l]) => '<button data-act="taskTab" data-k="' + k + '" class="' + (ui.taskTab === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div><input class="input" style="width:180px" id="taskQ" placeholder="タスクを検索" value="' + esc(ui.taskQ) + '"><select class="input" style="width:auto" id="taskSt"><option value="">すべての状態</option><option value="todo"' + (ui.taskSt === 'todo' ? ' selected' : '') + '>未着手</option><option value="doing"' + (ui.taskSt === 'doing' ? ' selected' : '') + '>進行中</option><option value="done"' + (ui.taskSt === 'done' ? ' selected' : '') + '>完了</option></select></div>';
  const list = all.filter(t => (!ui.taskQ || t.title.includes(ui.taskQ)) && (!ui.taskSt || t.status === ui.taskSt)).sort((a, b) => (a.start || '') < (b.start || '') ? -1 : 1);
  if (!list.length) return h + '<div class="panel">' + emptyBox('タスクはまだありません', 'タスクを登録すると、担当者別の進捗とガントチャートに反映されます。', I.tasks) + '</div>';
  const stl = { todo: '未着手', doing: '進行中', done: '完了' };
  if (ui.taskTab === 'list') {
    h += '<div class="tbl-wrap"><table><thead><tr><th>タスク</th><th>担当</th><th>媒体</th><th>期間</th><th>状態</th><th></th></tr></thead><tbody>' + list.map(t => '<tr><td style="white-space:normal"><b>' + esc(t.title) + '</b>' + (t.status !== 'done' && t.end < today ? ' <span class="chip bad">期限超過</span>' : '') + '</td><td>' + esc(t.assignee) + '</td><td>' + (CHM[t.channel] || {}).l + '</td><td class="num">' + esc((t.start || '').slice(5).replace('-', '/')) + '〜' + esc((t.end || '').slice(5).replace('-', '/')) + '</td><td><select data-taskst="' + t.id + '" aria-label="状態">' + Object.entries(stl).map(([k, l]) => '<option value="' + k + '"' + (t.status === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></td><td><button class="btn sm ghost" data-act="delTask" data-id="' + t.id + '">削除</button></td></tr>').join('') + '</tbody></table></div>';
  } else {
    const ds = list.flatMap(t => [t.start, t.end]).filter(Boolean).sort();
    const d0 = new Date(ds[0]), d1 = new Date(ds[ds.length - 1]); d0.setDate(d0.getDate() - 1); d1.setDate(d1.getDate() + 2);
    const span = Math.max(1, (d1 - d0) / 864e5), pos = d => ((new Date(d) - d0) / 864e5 / span * 100);
    let ticks = ''; const step = span > 60 ? 7 : span > 21 ? 3 : 1;
    for (let i = 0; i < span; i += step) { const d = new Date(d0); d.setDate(d.getDate() + i); ticks += '<div class="g-tick" style="left:' + (i / span * 100) + '%">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>'; }
    const tp = pos(today);
    h += '<div class="gantt"><div class="g-row g-head"><div>タスク</div><div class="g-track">' + ticks + '</div></div>' + list.map(t => { const l = pos(t.start), w = Math.max(1.5, pos(t.end) - l + 100 / span); return '<div class="g-row"><div title="' + esc(t.title) + '">' + esc(t.title) + '</div><div class="g-track">' + (tp >= 0 && tp <= 100 ? '<div class="g-today" style="left:' + tp + '%"></div>' : '') + '<div class="g-bar ' + t.status + '" style="left:' + l + '%;width:' + w + '%" title="' + stl[t.status] + '"></div></div></div>'; }).join('') + '</div>' +
      '<div class="legend"><span><i class="k0"></i>進行中</span><span><i class="k0" style="opacity:.45"></i>未着手</span><span><i class="k2"></i>完了</span><span><i style="background:var(--bad);width:2px"></i>今日</span></div>';
  }

  } else if (id === 'editorForm') {
    const name = $('#eName').value.trim(); if (!name) return;
    S.editors.push({ id: uid(), name, email: $('#eMail').value.trim(), role: $('#eRole').value, clients: $$('input[name=eCli]:checked').map(x => x.value) });
    ui.newEditor = false; save('「' + name + '」を登録しました'); render();
  } else if (id === 'fileForm') {
    const c = client(); c.files = c.files || []; c.files.push({ id: uid(), name: $('#fName').value.trim(), url: $('#fUrl').value.trim(), memo: $('#fMemo').value.trim() }); save('追加しました'); render();
  } else if (id === 'taskForm') {
    const s = $('#tStart').value, en = $('#tEnd').value; if (en < s) { toast('期限は開始日より後にしてください'); return; }
    S.tasks[S.current] = S.tasks[S.current] || [];
    S.tasks[S.current].push({ id: uid(), title: $('#tTitle').value.trim(), assignee: $('#tAsg').value, channel: $('#tCh').value, start: s, end: en, status: $('#tSt').value });
    ui.newTask = false; save('タスクを追加しました'); render();
  }
});

applyTheme();
render();
})();
</script>
